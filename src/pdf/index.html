<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:">
<title>BTS PDF Pro</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="pdf.css">
</head>
<body class="app-pdf">
<div class="workspace" id="ws">
  <div class="options-bar" id="optbar"></div>
  <div class="doc-tabs hidden" id="docTabs"></div>
  <div class="mid">
    <div class="toolbar" id="toolbar"></div>
    <div class="leftpane" id="leftpane">
      <div class="tabs" id="leftTabs">
        <div class="tab active" data-t="thumbs">Pages</div>
        <div class="tab" data-t="outline">Bookmarks</div>
        <div class="tab" data-t="comments">Comments</div>
        <div class="tab" data-t="search">Search</div>
      </div>
      <div class="lp-body" id="lpBody"></div>
    </div>
    <div class="stage" id="stage">
      <div class="pages" id="pages"></div>
      <div class="organizer hidden" id="organizer"></div>
    </div>
    <div class="panels" id="props"></div>
  </div>
  <div class="statusbar" id="status">
    <span id="stPage">No document</span>
    <span id="stTool"></span>
    <div class="right">
      <button class="btn ghost sm" id="zOut">−</button>
      <select id="zoomSel" style="height:22px;font-size:11.5px">
        <option value="fit-width">Fit width</option><option value="fit-page">Fit page</option>
        <option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option>
        <option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="4">400%</option>
      </select>
      <button class="btn ghost sm" id="zIn">+</button>
    </div>
  </div>
</div>
<div id="printArea"></div>
<script src="../shared/ui.js"></script>
<script src="../vendor/pdf-lib.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
