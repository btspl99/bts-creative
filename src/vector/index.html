<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; img-src 'self' data: blob:">
<title>BTS Vector</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .workspace { grid-template-rows: 42px 1fr 26px; }
  .mid { display: grid; grid-template-columns: 48px 1fr 300px; min-height: 0; }
  .viewport { position: relative; overflow: hidden; background: #2a2b31; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .fs { position: relative; width: 38px; height: 40px; margin-top: 8px; flex-shrink: 0; }
  .fs .sw { position: absolute; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
  .fs .fill { left: 1px; top: 1px; z-index: 2; border: 1px solid #000; box-shadow: 0 0 0 2px #ddd; }
  .fs .stroke { right: 1px; bottom: 1px; background: transparent; border: 6px solid #000; box-shadow: 0 0 0 1px #ddd; }
  .fs .sw.front { z-index: 3; }
  .fs .none { background: linear-gradient(to top right, #fff calc(50% - 1.5px), #e00 50%, #fff calc(50% + 1.5px)) !important; }
  .sec { border-bottom: 1px solid var(--line); padding: 10px 12px 12px; }
  .sec h4 { margin: 0 0 9px; font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--tx-2); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .grid2 label { display: flex; align-items: center; gap: 6px; color: var(--tx-2); font-size: 11.5px; }
  .grid2 input { width: 100%; height: 26px; font-size: 12px; }
  .colrow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; color: var(--tx-2); font-size: 12px; }
  .colrow .lbl { width: 46px; }
  .colrow select { height: 26px; font-size: 12px; }
  .icons { display: flex; flex-wrap: wrap; gap: 2px; }
  .icons .icon-btn { width: 30px; height: 30px; }
  .icons .icon-btn svg { width: 16px; height: 16px; }
  .layers-list .li { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; border-radius: 5px; font-size: 12px; color: var(--tx-1); }
  .layers-list .li:hover { background: var(--bg-3); }
  .layers-list .li.sel { background: var(--accent-soft); color: var(--tx-0); }
  .layers-list .li.layer { font-weight: 600; color: var(--tx-0); }
  .layers-list .li .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layers-list .li .ib { width: 20px; height: 20px; display: grid; place-items: center; color: var(--tx-3); }
  .layers-list .li .ib svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .layers-list .li .chip { width: 8px; height: 8px; border-radius: 2px; }
  .rp-scroll { flex: 1; overflow: auto; min-height: 0; }
  .text-in { position: absolute; z-index: 10; background: rgba(255,255,255,.95); color: #000; border: 1px dashed var(--accent); outline: none; padding: 0 2px; line-height: 1.2; white-space: pre; resize: none; overflow: hidden; }
</style>
</head>
<body class="app-vector">
<div class="workspace">
  <div class="options-bar" id="optbar"></div>
  <div class="mid">
    <div class="toolbar" id="toolbar"></div>
    <div class="viewport" id="viewport"><canvas id="cv" resize></canvas></div>
    <div class="panels">
      <div class="tabs" id="rtabs"><div class="tab active" data-t="props">Properties</div><div class="tab" data-t="layers">Layers</div><div class="tab" data-t="swatches">Swatches</div></div>
      <div class="rp-scroll" id="rp"></div>
    </div>
  </div>
  <div class="statusbar"><span id="stZoom">100%</span><span id="stArt"></span><span id="stPos"></span><div class="right"><span id="stSel"></span></div></div>
</div>
<script src="../shared/ui.js"></script>
<script src="../vendor/paper-core.min.js"></script>
<script src="../vendor/jspdf.umd.min.js"></script>
<script src="../vendor/svg2pdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
